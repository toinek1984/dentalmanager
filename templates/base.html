<!DOCTYPE html>
<html lang="nl">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>{% block title %}Mijn Project{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_head %}{% endblock %}
    <style>
      html, body {
          height: 100%;
          margin: 0;
          padding: 0;
      }
      .wrapper {
          min-height: 100%;
          display: flex;
          flex-direction: column;
      }
      .content {
          flex: 1;
      }
      footer {
          background: #f2f2f2;
          text-align: center;
          padding: 10px;
      }
    </style>
</head>
<body>
    <div class="wrapper">
        {% include 'partials/header.html' %}
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <footer>
            ©2025 Alle rechten voorbehouden
        </footer>
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
