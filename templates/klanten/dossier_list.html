{% extends 'base.html' %}
{% load static %}
{% block title %}Klantendossiers{% endblock %}

{% block content %}
<h1>Klantendossiers</h1>

<!-- Link naar nieuw dossier -->
<p>
  <a href="/klanten/dossiers/nieuw/" class="btn btn-primary">Nieuw dossier aanmaken</a>
</p>

<ul>
    {% for dossier in dossiers %}
        <li>
            <!-- Link naar detailpagina van dit dossier -->
            <a href="/klanten/dossiers/{{ dossier.klantnummer }}/">
                {{ dossier.klant.naam }}
            </a>
        </li>
    {% empty %}
        <li>Geen dossiers gevonden.</li>
    {% endfor %}
</ul>
{% endblock %}
