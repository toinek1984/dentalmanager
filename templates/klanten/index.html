{% extends 'base.html' %}
{% block title %}Klantenoverzicht{% endblock %}
{% block content %}
<h1>Klantenoverzicht</h1>
<ul>
    {% for klant in klanten %}
        <li>{{ klant.naam }} - {{ klant.woonplaats }}</li>
    {% empty %}
        <li>Geen klanten gevonden.</li>
    {% endfor %}
</ul>
{% endblock %}
