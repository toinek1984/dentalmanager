{% extends 'base.html' %}
{% load static %}

{% block title %}Debiteuren Dashboard{% endblock %}

{% block content %}
<h1>Debiteuren Dashboard</h1>
<a href="{% url 'debiteuren:toevoegen' %}" class="btn">Nieuwe Debiteur Toevoegen</a>
<ul>
  {% for item in items %}
    <li>
      <a href="{% url 'debiteuren:detail' item.pk %}">{{ item.naam }}</a>
    </li>
  {% empty %}
    <li>Geen debiteuren gevonden.</li>
  {% endfor %}
</ul>
{% endblock %}
