{% extends 'base.html' %}
{% load static %}

{% block title %}Facturatie Dashboard{% endblock %}

{% block content %}
<h1>Facturatie Dashboard</h1>
<a href="{% url 'facturatie:toevoegen' %}" class="btn">Nieuwe Factuur Toevoegen</a>
<ul>
  {% for item in items %}
    <li>
      <a href="{% url 'facturatie:detail' item.pk %}">{{ item.nummer }}</a>
    </li>
  {% empty %}
    <li>Geen facturen gevonden.</li>
  {% endfor %}
</ul>
{% endblock %}
