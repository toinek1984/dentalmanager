{% extends 'base.html' %}
{% load static %}
{% block title %}Planboard Resource View{% endblock %}
{% block content %}

<style>
  .planboard-container {
    display: flex;
    width: 100%;
    height: calc(100vh - 150px);
  }
  #sidebar {
    flex: 0 0 15%;
    display: flex;
    flex-direction: column;
    padding: 10px;
    border-right: 1px solid #ccc;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #sidebar-header {
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  #employee-select {
    width: 100%;
    padding: 5px;
    font-size: 1em;
  }
  #add-workorder {
    width: 100%;
    padding: 5px;
    font-size: 1em;
    cursor: pointer;
  }
  #calendar-container {
    flex: 1;
    padding: 10px;
    overflow: hidden;
  }
  #calendar {
    width: 100%;
    height: 100%;
  }
  .fc-timegrid-slot {
    height: 60px !important;
  }
</style>

<div class="planboard-container">
  <div id="sidebar">
    <div id="sidebar-header">
        <select id="employee-select">
            <option value="alle">Alle medewerkers</option>
            {% for werknemer in werknemers %}
                <option value="{{ werknemer.id }}">{{ werknemer.naam }}</option>
            {% endfor %}
        </select>
      <button id="add-workorder">Nieuwe werkbon toevoegen</button>
    </div>
  </div>
  <div id="calendar-container">
    <div id="calendar"></div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{% static 'fullcalendar/js/main.min.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log("Planboard Resource View initialisatie gestart.");

    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        schedulerLicenseKey: 'GPL-My-Project-Is-Open-Source',
        initialView: 'resourceTimeGridWeek',
        slotMinTime: "08:00:00",
        slotMaxTime: "18:00:00",
        locale: 'nl',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'resourceTimeGridWeek,dayGridMonth,timeGridDay'
        },
        editable: true,
        eventResourceEditable: true,
        resources: '/planning/api/resources/',
        events: '/planning/api/werkbonnen/'
    });
    calendar.render();

    var employeeSelect = document.getElementById('employee-select');
    if (employeeSelect) {
        employeeSelect.addEventListener('change', function() {
            fetch('/planning/api/resources/')
                .then(response => response.json())
                .then(data => {
                    var selected = this.value;
                    var filteredResources = selected === 'alle' ? data : data.filter(r => r.id == selected);
                    calendar.setOption('resources', filteredResources);
                    calendar.refetchEvents();
                });
        });
    }
});
</script>
{% endblock %}
