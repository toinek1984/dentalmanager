{% extends 'base.html' %}
{% load static %}
{% block title %}Planboard Resource View{% endblock %}

{% block content %}
<style>
  .planboard-container {
    display: flex;
    width: 100%;
    height: calc(100vh - 150px);
  }
  /* Sidebar styling */
  #sidebar {
    flex: 0 0 15%;
    padding: 10px;
    border-right: 1px solid #ccc;
    overflow-y: auto;
  }
  #sidebar-header {
    margin-bottom: 10px;
  }
  #employee-select {
    width: 100%;
    padding: 5px;
    font-size: 1em;
  }
  #add-workorder {
    width: 100%;
    padding: 8px;
    margin-top: 10px;
    background-color: #ccc;
    border: none;
    cursor: pointer;
  }
  /* Kalender container */
  #calendar-container {
    flex: 1;
    padding: 10px;
    overflow: hidden;
  }
  #calendar {
    width: 100%;
    height: 100%;
  }
  /* Extra styling voor tijdslots */
  .fc-timegrid-slot {
    height: 60px !important;
  }
</style>

<div class="planboard-container">
  <div id="sidebar">
    <div id="sidebar-header">
      <select id="employee-select">
        <option value="alle">Alle medewerkers</option>
        {% for werknemer in werknemers %}
          <option value="{{ werknemer.id }}">{{ werknemer.naam }}</option>
        {% endfor %}
      </select>
      <button id="add-workorder">Nieuwe werkbon toevoegen</button>
    </div>
  </div>
  <div id="calendar-container">
    <div id="calendar"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<link href="{% static 'fullcalendar_scheduler/resource-timegrid.min.css' %}" rel="stylesheet">
<script src="{% static 'fullcalendar/js/main.min.js' %}"></script>
<script src="{% static 'fullcalendar/js/interaction.global.min.js' %}"></script>
<script src="{% static 'fullcalendar_scheduler/resource-timegrid.min.js' %}"></script>
<script src="{% static 'js/planboard.js' %}"></script>
{% endblock %}
